# Override that wires Grafana to the Keycloak from docker-compose.keycloak.yml:
# generic OAuth, org_mapping per tenant and [auth.team_sync].
#
#   docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d grafana
#
# `make sso-deploy` does this in the right order. Needs the `kekaflow-sso`
# network, which docker-compose.keycloak.yml creates.
services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      GF_LOG_FILTERS: team.sync:debug

      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET:?set GRAFANA_CLIENT_SECRET in .env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # The browser talks to Keycloak on localhost, Grafana on the compose network.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:${KEYCLOAK_PORT:-8080}/realms/kekaflow/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/kekaflow/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/kekaflow/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups

      # Tenant isolation: each tenant is an organization. Orgs must exist before
      # Grafana starts (see grafana-bootstrap), because org names resolve at startup.
      GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ORG_MAPPING: "tenant-a-admins:TenantA:Admin tenant-a-users:TenantA:Editor tenant-b-users:TenantB:Viewer platform-admins:*:Admin"

      GF_AUTH_TEAM_SYNC_ENABLED: "true"
      GF_AUTH_TEAM_SYNC_AUTO_CREATE_TEAMS: "true"
      GF_AUTH_TEAM_SYNC_MAPPINGS: "tenant-a-ops:TenantA:Ops tenant-a-dev:TenantA:Developers tenant-b-ops:TenantB:Ops"
    volumes:
      # A separate volume keeps the demo database (users, orgs, teams) apart from
      # the plain deployment and gives every demo a known admin password.
      - grafana-sso-data:/var/lib/grafana
    networks:
      - default
      - sso

  # One-shot job: creates the tenant organizations. Safe to run repeatedly.
  grafana-bootstrap:
    image: python:3.12-slim
    profiles: ["bootstrap"]
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_URL: http://grafana:3000
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      TENANT_ORGS: TenantA,TenantB
    volumes:
      - ./keycloak/bootstrap.py:/bootstrap.py:ro
    command: ["python", "/bootstrap.py"]

volumes:
  grafana-sso-data:

networks:
  sso:
    name: kekaflow-sso
    external: true
