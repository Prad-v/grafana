# Containerized test runner for everything under tests/.
#
#   docker compose -f tests/docker-compose.yml run --rm test
#
# Override the Go version or the package selection through tests/.env.
# An explicit project name stops Compose from deriving "tests" from the folder
# and mixing with unrelated projects that live in a directory of the same name.
name: grafana-tests

services:
  test:
    image: golang:${GO_VERSION:-1.27.3}
    working_dir: /src
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: ${GOFLAGS:-}
    volumes:
      - ..:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    # Build first: wire_gen.go is hand-maintained for the team sync hook and only
    # the compiler proves that the DI graph still matches the constructors.
    command:
      - sh
      - -ec
      - |
        go build ./pkg/setting/... ./pkg/services/authn/... ./pkg/server/...
        go vet ./pkg/services/authn/authnimpl/... ./tests/...
        go test -count=1 ${TEST_PACKAGES:-./tests/...}

  # Unit tests of the GPU simulator (backend/services/gpu-simulator). Standard
  # library only, so a plain python image is enough.
  sim-unit:
    image: python:3.12-slim
    working_dir: /tests
    environment:
      PYTHONPATH: /sim:/tests/gpu_simulator
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../backend/services/gpu-simulator:/sim:ro
      - ./gpu_simulator:/tests/gpu_simulator:ro
    command: ["python", "-m", "unittest", "discover", "-v", "-s", "/tests/gpu_simulator", "-p", "test_*.py"]

  # Unit tests of the anomaly detection core (backend/services/anomaly-engine). The tests are
  # their own Go module so they do not pull in Grafana's dependency graph; GOWORK=off keeps
  # the repository's go.work out of it. The standard library is all the engine uses, so no
  # network access is needed.
  anomaly-engine-unit:
    image: golang:${GO_VERSION:-1.27.3}
    working_dir: /src/tests/anomaly_engine
    environment:
      CGO_ENABLED: "1" # the race detector needs cgo
      GOWORK: "off"
    volumes:
      - ../backend/services/anomaly-engine:/src/backend/services/anomaly-engine:ro
      - ./anomaly_engine:/src/tests/anomaly_engine:ro
      - go-build-cache:/root/.cache/go-build
    command:
      - sh
      - -ec
      - |
        (cd ../../backend/services/anomaly-engine && go vet ./...)
        go vet ./...
        go test -count=1 -race -cover -coverpkg=github.com/kekaflow/anomaly-engine/... ./...

  # Unit and API tests of the chat agent (backend/services/grafana-chat-agent).
  # Runs inside the service image, so it uses the exact dependencies that ship.
  # The scripted model stands in for Claude, so it needs no API key and no network.
  chat-agent-unit:
    image: ${CHAT_AGENT_IMAGE:-kekaflow/grafana-chat-agent}:${CHAT_AGENT_TAG:-dev}
    build:
      context: ../backend/services/grafana-chat-agent
    working_dir: /tests
    user: root
    environment:
      PYTHONPATH: /app:/tests/chat_agent
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./chat_agent:/tests/chat_agent:ro
    command: ["python", "-m", "unittest", "discover", "-v", "-s", "/tests/chat_agent", "-p", "test_*.py"]

  # Unit tests of the Grafana chat page's stream parser and state logic. The plugin
  # source is TypeScript with no runtime dependencies in those files, so Node runs it as is.
  chat-plugin-unit:
    image: node:24-slim
    working_dir: /repo
    environment:
      NODE_NO_WARNINGS: "1"
    volumes:
      - ../plugins/kekaflow-chat-app/src:/repo/plugins/kekaflow-chat-app/src:ro
      - ./chat_plugin:/repo/tests/chat_plugin:ro
    command: ["node", "--test", "--test-reporter=spec", "tests/chat_plugin/*.test.ts"]

  # Lints and renders the Helm chart with every values file and checks the result.
  helm-chart:
    image: alpine/helm:3.17.0
    entrypoint: ["sh"]
    volumes:
      - ../helm/grafana-chat-agent:/chart:ro
      - ../helm/bump.sh:/bump/bump.sh:ro
      - ./helm:/tests/helm:ro
    command: ["-c", "/tests/helm/test_chart.sh && /tests/helm/test_bump.sh"]

  # End-to-end: real OAuth logins through Keycloak. Needs `make sso-up` first and
  # the root .env, so run it with `make sso-test`. Its secrets default to empty
  # here (instead of `:?`) because Compose interpolates the whole file, which
  # would break the `test` service above; the test itself rejects empty values.
  sso-e2e:
    profiles: ["sso"]
    image: python:3.12-slim
    working_dir: /tests
    environment:
      GRAFANA_INTERNAL_URL: http://grafana:3000
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-3000}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      KEYCLOAK_REALM: kekaflow
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      SSO_TEST_PASSWORD: ${SSO_TEST_PASSWORD:-}
    volumes:
      - ./sso:/tests/sso:ro
    networks:
      - sso
    command: ["python", "-m", "unittest", "discover", "-v", "-s", "/tests/sso", "-p", "test_*.py"]

  # End-to-end: metrics and logs flowing through VictoriaMetrics and
  # VictoriaLogs, and (when the URLs are passed) Grafana and mcp-grafana. Needs
  # `make obs-up` first, so run it with `make obs-test` or `make stack-test`.
  obs-e2e:
    profiles: ["obs"]
    image: python:3.12-slim
    working_dir: /tests
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      SIM_URL: http://gpu-simulator:8090
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability:/tests/observability:ro
    networks:
      - observability
    command: ["python", "-m", "unittest", "discover", "-v", "-s", "/tests/observability", "-p", "test_*.py"]

  # End-to-end: the chat page's backend path through Grafana's plugin proxy to the
  # agent and mcp-grafana. Needs `make stack-up` first, so run it with `make chat-e2e`.
  chat-e2e:
    profiles: ["chat"]
    image: python:3.12-slim
    working_dir: /tests
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      GRAFANA_INTERNAL_URL: http://grafana:3000
      CHAT_AGENT_INTERNAL_URL: http://chat-agent:8080
      PYTHONPATH: /tests/shared
      CHAT_AGENT_TOKEN: ${CHAT_AGENT_TOKEN:-}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./chat_e2e:/tests/chat_e2e:ro
      # The stand-in LiteLLM proxy that the settings tests start is the same one the unit tests use.
      - ./chat_agent/fake_openai.py:/tests/shared/fake_openai.py:ro
    networks:
      observability:
        # The agent reaches the stand-in proxy under this name (see CHAT_AGENT_ALLOWED_LLM_HOSTS).
        aliases: [fake-llm]
    command: ["python", "-m", "unittest", "discover", "-v", "-s", "/tests/chat_e2e", "-p", "test_*.py"]

networks:
  sso:
    name: kekaflow-sso
    external: true
  observability:
    name: kekaflow-observability
    external: true

volumes:
  go-mod-cache:
  go-build-cache:
