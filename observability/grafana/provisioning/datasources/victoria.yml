apiVersion: 1

datasources:
  # The official VictoriaMetrics data source plugin: MetricsQL editor, WITH
  # templates, and query tracing. The dashboards use this one.
  # Installed by GF_PLUGINS_PREINSTALL_SYNC in docker-compose.observability-grafana.yml.
  - name: VictoriaMetrics
    uid: victoriametrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  # The same VictoriaMetrics through the Prometheus query API. Grafana's alerting
  # and the mcp-grafana `query_prometheus` tool only work with Prometheus-type
  # data sources, so they use this one.
  - name: VictoriaMetrics (Prometheus API)
    uid: victoriametrics-prom
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s

  # Installed by GF_PLUGINS_PREINSTALL_SYNC in docker-compose.observability-grafana.yml.
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: false
