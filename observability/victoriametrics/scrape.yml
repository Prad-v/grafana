# Scrape configuration for VictoriaMetrics (same format as Prometheus).
global:
  scrape_interval: 10s

scrape_configs:
  # The simulated dcgm-exporter fleet. honor_labels keeps the `instance` the
  # simulator reports per node (<node>:9400) instead of the scrape target.
  - job_name: dcgm-exporter
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["gpu-simulator:8090"]

  # The simulator's own health: GPUs visible, active faults, log shipping.
  - job_name: gpu-simulator
    metrics_path: /sim/metrics
    static_configs:
      - targets: ["gpu-simulator:8090"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]
