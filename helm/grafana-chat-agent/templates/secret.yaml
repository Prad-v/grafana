{{- if not .Values.auth.existingSecret }}
{{- $token := required "Set auth.existingSecret, or auth.token to create one." .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-chat-agent.authSecretName" . }}
  labels:
    {{- include "grafana-chat-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ $token | quote }}
{{- end }}
---
{{- if not .Values.anthropic.existingSecret }}
{{- $key := required "Set anthropic.existingSecret, or anthropic.apiKey to create one." .Values.anthropic.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-chat-agent.anthropicSecretName" . }}
  labels:
    {{- include "grafana-chat-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.anthropic.existingSecretKey }}: {{ $key | quote }}
{{- end }}
