{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana-chat-agent.fullname" . }}
  labels:
    {{- include "grafana-chat-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grafana-chat-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default .Release.Namespace .Values.networkPolicy.grafanaNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.grafanaPodLabels | nindent 14 }}
      ports:
        - port: 8080
{{- end }}
