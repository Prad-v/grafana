# Production cluster. Use with: helm install ... -f values.yaml -f values-prod.yaml
# The secrets come from existing Secrets (for example from your secrets manager).
auth:
  existingSecret: grafana-chat-agent-auth

anthropic:
  existingSecret: grafana-chat-agent-anthropic

agent:
  logLevel: INFO
  allowWrites: false

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 768Mi
